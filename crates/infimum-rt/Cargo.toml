[package]
name = "infimum-rt"
version = "0.3.0"
edition.workspace = true
authors.workspace = true
license = "AGPL-3.0-only OR LicenseRef-Infimum-Commercial"
publish = false
description = "Zero-GPU headless B2B WebAssembly sandbox runtime for Z3-verified Infimum .ifw capsules"

[dependencies]
infimum-lang = { path = "../infimum-lang" }
wasmi = "0.40"
blake3 = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
