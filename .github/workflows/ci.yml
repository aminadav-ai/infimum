name: Infimum Monorepo CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  workspace-verify-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Z3 SMT solver & system graphics deps
        run: |
          sudo apt-get update
          sudo apt-get install -y z3 libasound2-dev libwayland-dev libxkbcommon-dev

      - name: Install Rust toolchain & wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Run full workspace test suite
        run: cargo test --workspace

      - name: Run infimum-lang corpus & checks
        working-directory: crates/infimum-lang
        run: |
          ./scripts/run_checks.sh
          ./scripts/ci_verify_corpus.sh

      - name: Verify precompiled Infimum Code capsule exists
        run: test -s apps/infimum-code/capsule/infimum_code.ifw
