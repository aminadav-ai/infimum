name: Infimum Monorepo CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  workspace-verify-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Z3 SMT solver & system graphics deps
        run: |
          sudo apt-get update
          sudo apt-get install -y z3 libasound2-dev libwayland-dev libxkbcommon-dev

      - name: Install Rust toolchain & wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Lint workspace with Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run full workspace test suite
        run: cargo test --workspace

      - name: Check wasm32 browser targets (infimum-lang & infimum-web)
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo check -p infimum-lang --lib --target wasm32-unknown-unknown
          cargo check -p infimum-web --lib --target wasm32-unknown-unknown

      - name: Run infimum-lang corpus, ABI sync & checks
        working-directory: crates/infimum-lang
        run: |
          ./scripts/run_checks.sh
          ./scripts/ci_verify_corpus.sh

      - name: Headless runtime & passport check on Infimum Code capsule
        run: |
          test -s apps/infimum-code/capsule/infimum_code.ifw
          cargo run --release -p infimum-web -- --headless-check apps/infimum-code/capsule/infimum_code.ifw --allow-net=127.0.0.1:1 --allow-net=infimum-lang.org --allow-clipboard

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo audit (RustSec advisory DB)
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run cargo deny (licenses, advisories, bans)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features check licenses advisories bans

  publish-repo-snapshot:
    needs: workspace-verify-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build repo_bundle.json.gz & repo_meta.json
        run: python3 crates/infimum-lang/scripts/build_repo_bundle.py --out-dir dist-snapshot

      - name: Upload to rolling GitHub Release 'repo-snapshot'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view repo-snapshot >/dev/null 2>&1; then
            gh release create repo-snapshot \
              --title "Live Repository Snapshot (for Infimum Code AI)" \
              --notes "Auto-updated on every green push to main." \
              --prerelease
          fi
          gh release upload repo-snapshot \
            dist-snapshot/repo_meta.json \
            dist-snapshot/repo_bundle.json.gz \
            --clobber
